services:
  mysql:
    image: mysql:8.4
    container_name: expiry-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_assistant
    ports:
      - "3307:3306"
    volumes:
      - expiry_mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    container_name: expiry-redis
    ports:
      - "6380:6379"
    volumes:
      - expiry_redis_data:/data
    restart: unless-stopped

  app:
    build: .
    container_name: expiry-management-app
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventory_assistant?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Helsinki
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped

volumes:
  expiry_mysql_data:
  expiry_redis_data: