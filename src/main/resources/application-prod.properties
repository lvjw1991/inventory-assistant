server.port=443

server.ssl.enabled=true
server.ssl.key-store: classpath:keystoreprod.p12
server.ssl.key-store-password: ${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type: PKCS12
server.ssl.key-alias: ia


spring.datasource.url=jdbc:mysql://localhost:3306/inventory_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Europe/Helsinki
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}