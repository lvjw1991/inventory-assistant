spring.application.name=inventory-assistant
server.port=443
server.servlet.context-path=/ia

server.ssl.enabled=true
server.ssl.key-store: classpath:keystoreprod.p12
server.ssl.key-store-password: ${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type: PKCS12
server.ssl.key-alias: ia


spring.datasource.url=jdbc:mysql://localhost:3306/inventory_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Europe/Helsinki
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true

springdoc.swagger-ui.path: /swagger-ui.html
springdoc.swagger-ui.tags-sorter: alpha
springdoc.swagger-ui.operations-sorter: alpha
springdoc.api-docs.path: /v3/api-docs

# application.properties
jwt.secret=recoverSupermarketSecretKey2026!!
jwt.expiration=86400000

