spring.application.name=recover
server.servlet.context-path=/ia


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inventory_assistant}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# application.properties
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# 连接池
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

springdoc.swagger-ui.path: /swagger-ui.html
springdoc.swagger-ui.tags-sorter: alpha
springdoc.swagger-ui.operations-sorter: alpha
springdoc.api-docs.path: /v3/api-docs

# application.properties
jwt.secret=recoverSupermarketSecretKey2026!!
jwt.expiration=86400000

redis.productKey=product:
redis.cacheTime=3600